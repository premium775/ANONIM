<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- --- SEO Meta Teglar --- -->
    <title>SHADOW MARKET | Shifrlangan Izohlar</title>
    <meta name="description" content="Shadow Market - faqat izohlar shifrlanadigan maxfiy savdo platformasi.">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="SHADOW MARKET">
    <meta property="og:image" content="https://picsum.photos/seed/shadow/1200/630">

    <style>
        /* --- STILAR --- */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-color: #00ff41; 
            --accent-hover: #00cc33;
            --danger-color: #ff3333;
            --border-color: #333;
            --font-family: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        header {
            background-color: #000;
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--accent-color);
        }

        .nav-actions button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.3s;
            margin-left: 10px;
        }

        .nav-actions button:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .modal.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            padding: 25px;
            width: 90%;
            max-width: 500px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--danger-color);
        }

        /* --- Rasm Yuklash Stili --- */
        .file-upload-wrapper {
            position: relative;
            margin-bottom: 15px;
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            transition: 0.3s;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent-color);
            background-color: #111;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #previewImage {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            display: none;
            border: 1px solid var(--accent-color);
        }

        /* --- Forma --- */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--accent-color); font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px;
            background-color: #000;
            border: 1px solid var(--border-color);
            color: #fff; font-family: inherit;
        }
        
        /* Izoh kiritish qismi maxsus rangda */
        .comment-input {
            background-color: #050505 !important;
            color: var(--accent-color) !important;
            font-weight: bold;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%; padding: 12px;
            background-color: var(--accent-color);
            color: #000; border: none;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn:hover { background-color: var(--accent-hover); }

        /* --- Grid va Karta --- */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .feed-header { text-align: center; margin-bottom: 30px; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .product-card:hover { border-color: var(--accent-color); }

        .product-img {
            width: 100%; height: 200px; object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            background-color: #000;
        }

        .product-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .seller-info { font-size: 0.8rem; color: var(--accent-color); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .product-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .product-desc { font-size: 0.9rem; color: #ccc; margin-bottom: 15px; flex-grow: 1; }
        .product-meta { border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .price-tag { font-weight: bold; color: var(--accent-color); }

        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 5px; background: #222; border: 1px solid #444; color: #fff; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .action-btn:hover { background: #333; }
        .btn-like.liked { color: #ff3333; border-color: #ff3333; }
        .btn-delete { color: var(--danger-color); border-color: var(--danger-color); display: none; }
        .btn-delete:hover { background: var(--danger-color); color: #fff; }

        /* Izohlar */
        .comments-section { background-color: #111; margin-top: 10px; padding: 10px; border-top: 1px solid var(--border-color); display: none; }
        .comments-section.open { display: block; }
        .comment-list { margin-bottom: 10px; max-height: 100px; overflow-y: auto; }
        .comment-item { font-size: 0.75rem; margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 3px; }
        .comment-user { color: var(--accent-color); font-weight: bold; }
        
        /* Shifrlangan izoh matni uchun rang */
        .comment-text {
            color: #aaa;
            font-family: monospace;
        }
        
        .comment-input-group { display: flex; gap: 5px; }
        /* Izoh yozish maydoni */
        .comment-input-field {
            flex: 1; padding: 5px; font-size: 0.8rem; background: #000; border: 1px solid #333; color: var(--accent-color); font-family: 'Courier New', monospace;
        }

        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 2px; padding: 16px; position: fixed;
            z-index: 2000; left: 50%; bottom: 30px; transform: translateX(-50%);
            border: 1px solid var(--accent-color);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SHADOW<span style="color:#fff">MARKET</span></div>
        <div class="nav-actions">
            <button onclick="openAddModal()">+ POST QO'SHISH</button>
            <button onclick="clearAllData()">TOZALASH</button>
        </div>
    </header>

    <main class="container">
        <div class="feed-header">
            <h2>SO'NGGI E'LONLAR</h2>
            <p style="font-size: 0.8rem; color: #666;">Izohlar shifrlanadi</p>
        </div>

        <div id="productsGrid" class="products-grid"></div>
        <div id="emptyState" class="empty-state" style="display: none;"><p>Hozircha e'lonlar yo'q.</p></div>
    </main>

    <!-- Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAddModal()">&times;</span>
            <h2 style="color: var(--accent-color); margin-bottom: 20px;">YANGI E'LON</h2>
            <form id="productForm">
                
                <!-- RASM -->
                <div class="file-upload-wrapper">
                    <p style="color: var(--text-muted);">📁 RASMNI TANLANG</p>
                    <input type="file" id="imgUpload" accept="image/*" onchange="previewFile()">
                    <img id="previewImage" alt="Oldindan ko'rish">
                </div>

                <!-- NOMI (Oddiy) -->
                <div class="form-group">
                    <label>MAHSULOT NOMI</label>
                    <input type="text" id="prodTitle" placeholder="Nomi..." required>
                </div>

                <div class="form-group">
                    <label>NARX</label>
                    <input type="text" id="prodPrice" required>
                </div>

                <!-- IZOH (Oddiy) -->
                <div class="form-group">
                    <label>IZOH</label>
                    <textarea id="prodDesc" rows="3" placeholder="Tavsif..." required></textarea>
                </div>

                <hr style="border-color: #333; margin: 15px 0;">

                <div class="form-group">
                    <label>SOTUVCHI ISMI / FIRMA</label>
                    <input type="text" id="sellerName" required>
                </div>

                <div class="form-group">
                    <label>TELEGRAM USER / NOMER</label>
                    <input type="text" id="sellerContact" required>
                </div>

                <button type="submit" class="submit-btn">E'LONNI JONATISH</button>
            </form>
        </div>
    </div>

    <div id="toast">Xabar</div>

    <script>
        // --- O'ZGARUVCHILAR ---
        let currentUserId = localStorage.getItem('shadowMarketUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('shadowMarketUserId', currentUserId);
        let uploadedImageBase64 = '';

        // --- SHIFRLASH JADVALI ---
        const cipherMap = {
            'S': '1', 's': '1!',
            'A': '2', 'a': '2!',
            'L': '3', 'l': '3!',
            'O': '4', 'o': '4!',
            'M': '5', 'm': '5!',
            'I': '6', 'i': '6!',
            'K': '7', 'k': '7!',
            'R': '8', 'r': '8!',
            'T': '9', 't': '9!',
            ' ': '0'
        };

        // --- SHIFRLASH FUNKSIYASI ---
        function encryptText(text) {
            return text.split('').map(char => {
                return cipherMap[char] || char;
            }).join('');
        }

        // --- COMMENT ENCRYPTION EVENT ---
        // Sahifa yuklanganda izoh maydonlaridagi hodisalarni kuzatamiz
        document.addEventListener('input', function(e) {
            // Faqat class'i 'comment-input-field' bo'lgan inputlarni qidiramiz
            if (e.target.classList.contains('comment-input-field')) {
                const input = e.target;
                // Kiritilayotgan matnni shifrlaymiz
                input.value = encryptText(input.value);
                // Kursor oxiriga qo'yamiz (matn o'zgargani uchun)
                input.selectionStart = input.selectionEnd = input.value.length;
            }
        });

        // --- QOLGAN FUNKSIYALAR ---

        function getProducts() {
            return JSON.parse(localStorage.getItem('shadowMarketProducts') || '[]');
        }

        function saveProducts(products) {
            try {
                localStorage.setItem('shadowMarketProducts', JSON.stringify(products));
            } catch (e) {
                alert("Xatolik: Ma'lumotlar hajmi juda katta.");
            }
        }

        function previewFile() {
            const preview = document.getElementById('previewImage');
            const file = document.getElementById('imgUpload').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                uploadedImageBase64 = reader.result;
                preview.src = uploadedImageBase64;
                preview.style.display = 'block';
            }, false);

            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Rasm hajmi 2MB dan oshmasligi kerak!");
                    document.getElementById('imgUpload').value = ""; 
                    return;
                }
                reader.readAsDataURL(file);
            }
        }

        function renderProducts() {
            const products = getProducts();
            const grid = document.getElementById('productsGrid');
            const empty = document.getElementById('emptyState');
            
            grid.innerHTML = '';
            if (products.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            [...products].reverse().forEach(product => {
                const isOwner = product.authorId === currentUserId;
                const imgSrc = product.image ? product.image : `https://picsum.photos/seed/${product.id}/400/300`;

                // Izohlarni render qilish
                let commentsHtml = '';
                if (product.comments && product.comments.length > 0) {
                    commentsHtml = product.comments.map(c => `
                        <div class="comment-item">
                            <span class="comment-user">${c.user}:</span> 
                            <span class="comment-text">${c.text}</span>
                        </div>
                    `).join('');
                } else {
                    commentsHtml = '<p style="color:#666;font-size:0.8rem">Izohlar yo\'q.</p>';
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgSrc}" class="product-img" onerror="this.src='https://picsum.photos/seed/error/400/300'">
                    <div class="product-body">
                        <div class="seller-info">
                            <span>${product.sellerName}</span>
                            <span>${product.date}</span>
                        </div>
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-desc">${product.description}</p>
                        <div class="product-meta">
                            <span class="price-tag">${product.price}</span>
                            <a href="https://t.me/${product.contact.replace('@','')}" target="_blank" style="color:var(--accent-color)">✆ ${product.contact}</a>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-like ${product.likedBy?.includes(currentUserId) ? 'liked' : ''}" onclick="toggleLike('${product.id}')">♥ ${product.likes || 0}</button>
                            <button class="action-btn" onclick="toggleComments('${product.id}')">💬 ${product.comments?.length || 0}</button>
                            <button class="action-btn btn-delete" style="display: ${isOwner ? 'flex' : 'none'}" onclick="deleteProduct('${product.id}')">🗑</button>
                        </div>
                        <div id="comments-${product.id}" class="comments-section">
                            <div class="comment-list" id="list-${product.id}">
                                ${commentsHtml}
                            </div>
                            <div class="comment-input-group">
                                <!-- Bu maydon class="comment-input-field" ga ega, shifr ishlaydi -->
                                <input type="text" id="input-${product.id}" class="comment-input-field" placeholder="Izohni shifrlab yozing..." autocomplete="off">
                                <button class="action-btn" onclick="addComment('${product.id}')">OK</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAddModal() { document.getElementById('addModal').classList.add('active'); }
        function closeAddModal() { 
            document.getElementById('addModal').classList.remove('active'); 
            document.getElementById('productForm').reset();
            document.getElementById('previewImage').style.display = 'none';
            uploadedImageBase64 = '';
        }
        window.onclick = (e) => { if (e.target.id === 'addModal') closeAddModal(); };

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newProduct = {
                id: Date.now().toString(),
                image: uploadedImageBase64,
                title: document.getElementById('prodTitle').value, // Oddiy matn
                price: document.getElementById('prodPrice').value,
                description: document.getElementById('prodDesc').value, // Oddiy matn
                sellerName: document.getElementById('sellerName').value,
                contact: document.getElementById('sellerContact').value,
                date: new Date().toLocaleDateString(),
                authorId: currentUserId,
                likes: 0, likedBy: [], comments: []
            };

            const products = getProducts();
            products.push(newProduct);
            saveProducts(products);
            renderProducts();
            closeAddModal();
            showToast("E'lon qo'shildi!");
        });

        function toggleLike(id) {
            const products = getProducts();
            const p = products.find(x => x.id === id);
            if(p) {
                if(!p.likedBy) p.likedBy = [];
                const idx = p.likedBy.indexOf(currentUserId);
                if(idx === -1) { p.likes++; p.likedBy.push(currentUserId); }
                else { p.likes--; p.likedBy.splice(idx, 1); }
                saveProducts(products); renderProducts();
            }
        }

        function toggleComments(id) {
            document.getElementById(`comments-${id}`).classList.toggle('open');
        }

        function addComment(id) {
            const input = document.getElementById(`input-${id}`);
            if(!input.value.trim()) return;
            const products = getProducts();
            const p = products.find(x => x.id === id);
            if(p) {
                if(!p.comments) p.comments = [];
                // Shifr matnini saqlaymiz
                p.comments.push({user: 'Foydalanuvchi', text: input.value});
                saveProducts(products); renderProducts();
                // Qayta ochib qo'yamiz
                setTimeout(() => document.getElementById(`comments-${id}`).classList.add('open'), 50);
            }
        }

        function deleteProduct(id) {
            if(confirm("O'chirasizmi?")) {
                const products = getProducts().filter(p => p.id !== id);
                saveProducts(products); renderProducts();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.className = "show";
            setTimeout(() => t.className = t.className.replace("show", ""), 3000);
        }

        function clearAllData() {
            if(confirm("Hammasini o'chirasizmi?")) {
                localStorage.removeItem('shadowMarketProducts');
                renderProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
